name = "ibms-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "ibms-db"
database_id = "local-ibms-db-id"

[[r2_buckets]]
binding = "INVOICE_BUCKET"
bucket_name = "ibms-invoices"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "local-ibms-kv-id"

[[queues.producers]]
binding = "WA_REMINDER_QUEUE"
queue = "wa-reminder-queue"

[[queues.consumers]]
queue = "wa-reminder-queue"

[triggers]
crons = ["0 17 1 * *"]  # tiap tgl 1, jam 00:00 WIB (UTC+7)

[vars]
JWT_SECRET = "dev-secret-key-change-in-prod"
WA_GATEWAY_API_KEY = "dev-fonnte-key"
